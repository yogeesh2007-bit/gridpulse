; PlatformIO project for the relay + button bulb node (also builds in the Arduino IDE: open relay_bulb_node.ino).
;   pio run            compile
;   pio run -t upload  flash        pio device monitor  serial log at 115200
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
