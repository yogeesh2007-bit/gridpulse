; PlatformIO project for the GridPulse ESP32 firmware.
; The same sketch also builds in the Arduino IDE (open esp32_station_a.ino; this file is ignored there).
;
;   cd firmware/esp32_station_a
;   pio run                      ; compile
;   pio run -t upload            ; flash (board connected over USB)
;   pio device monitor           ; serial log at 115200 baud

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    bblanchon/ArduinoJson@^7.0.0

; Same sketch against the newer arduino-esp32 3.x core (what a fresh Arduino IDE installs today).
; Build with:  pio run -e esp32_core3
[env:esp32_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    bblanchon/ArduinoJson@^7.0.0
